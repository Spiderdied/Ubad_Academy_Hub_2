# Robolectric runtime configuration for unit tests.
#
# The app targets SDK 36, but Robolectric (4.14.1) runs its simulated Android
# runtime up to SDK 35. Without this pin, every Robolectric test fails at
# configuration time with:
#
#   Package targetSdkVersion=36 > maxSdkVersion=35
#
# That is a limitation of the test *runtime*, not of the app — the APK still
# targets 36. Pin the simulated SDK here so the backup/restore suites (the
# §22 data-migration guards) execute everywhere.
sdk=35
