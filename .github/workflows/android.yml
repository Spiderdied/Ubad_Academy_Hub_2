name: Android build

on:
  push:
    branches: [ 'arena/**', 'main' ]
    paths: [ 'android/**', '.github/workflows/android.yml', 'tools/android-security-scan.py', 'tools/smoke/**' ]
  pull_request:
    paths: [ 'android/**' ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Also build release APK + AAB'
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Security scan (sources)
        run: python3 ../tools/android-security-scan.py source

      - name: Assemble debug + unit tests
        id: build
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest 2>&1 | tee build.log

      - name: Release APK + AAB
        id: release
        if: success() && (github.event.inputs.release == 'true' || contains(github.event.head_commit.message, '[release]'))
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease bundleRelease 2>&1 | tee release.log

      - name: Security scan (APK + merged manifest)
        if: success()
        run: python3 ../tools/android-security-scan.py apk

      - name: Report problems as annotations
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, os, re, xml.etree.ElementTree as ET
          def emit(kind, title, lines):
              if not lines: return
              chunk = []
              n = 0
              for l in lines:
                  chunk.append(l)
                  if len(chunk) >= 25:
                      msg = '%0A'.join(x.replace('%','%25').replace('\r','') for x in chunk)
                      print(f"::{kind} title={title} {n}::{msg}"); n += 1; chunk = []
                      if n >= 9: return
              if chunk:
                  msg = '%0A'.join(x.replace('%','%25').replace('\r','') for x in chunk)
                  print(f"::{kind} title={title} {n}::{msg}")
          errs = []
          for log in ('build.log', 'release.log'):
              if not os.path.exists(log): continue
              lines = open(log, errors='replace').read().splitlines()
              for i, l in enumerate(lines):
                  if l.startswith('e: ') or 'error:' in l.lower() and ('.kt' in l or '.xml' in l or 'AAPT' in l or 'ksp' in l.lower()):
                      errs.append(l.replace('file:///home/runner/work/Ubad_Academy_Hub_2/Ubad_Academy_Hub_2/android/', ''))
                  if l.startswith('* What went wrong'):
                      errs.extend(lines[i+1:i+12])
          emit('error', 'Build', errs[:220])
          fails = []
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                      txt = (fl.get('message') or '') + ' ' + (fl.text or '')[:600]
                      fails.append(f"{tc.get('classname')}.{tc.get('name')}: " + ' '.join(txt.split())[:700])
          emit('error', 'Tests', fails[:200])
          total = sum(len(list(ET.parse(f).getroot().iter('testcase'))) for f in glob.glob('app/build/test-results/**/*.xml', recursive=True))
          apks = [f"{p} ({os.path.getsize(p)//1024} KB)" for p in glob.glob('app/build/outputs/**/*.apk', recursive=True) + glob.glob('app/build/outputs/**/*.aab', recursive=True)]
          print(f"::notice title=Summary::tests={total} failures={len(fails)} outputs=" + ' | '.join(apks))
          warns = []
          if os.path.exists('build.log'):
              warns = [l.replace('file:///home/runner/work/Ubad_Academy_Hub_2/Ubad_Academy_Hub_2/android/', '') for l in open('build.log', errors='replace').read().splitlines() if l.startswith('w: ')]
          emit('warning', 'KotlinWarnings', warns[:50])
          EOF

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ubad-academy-apks
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

  # Runtime smoke test of the R8-minified release APK on an emulator (release runs only).
  smoke:
    needs: build
    if: github.event.inputs.release == 'true' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@v4
        with:
          name: ubad-academy-apks
          path: out

      - name: Sign release APK with a throwaway CI key (never stored)
        run: |
          set -e
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(find out -name 'app-release*.apk' | head -1)
          keytool -genkeypair -keystore /tmp/smoke.jks -storepass smoke-only -keypass smoke-only -alias smoke \
            -dname CN=ubad-smoke -keyalg RSA -keysize 2048 -validity 2 >/dev/null
          "$BT/zipalign" -f -p 4 "$APK" /tmp/aligned.apk
          "$BT/apksigner" sign --ks /tmp/smoke.jks --ks-pass pass:smoke-only --out /tmp/smoke.apk /tmp/aligned.apk
          "$BT/apksigner" verify /tmp/smoke.apk && rm /tmp/smoke.jks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/smoke/smoke.py /tmp/smoke.apk smoke-out

      - name: Report smoke results
        if: always()
        run: |
          python3 - <<'PY'
          import os, glob, subprocess
          lines = open('smoke-out/report.txt').read().splitlines() if os.path.exists('smoke-out/report.txt') else ['no report']
          if os.path.exists('smoke-out/crash.txt'):
              m = glob.glob('out/**/mapping.txt', recursive=True)
              rt = glob.glob(os.environ.get('ANDROID_HOME', '') + '/cmdline-tools/*/bin/retrace')
              if m and rt:
                  r = subprocess.run([rt[0], m[0], 'smoke-out/crash.txt'], capture_output=True, text=True)
                  open('smoke-out/crash-retraced.txt', 'w').write(r.stdout)
                  lines += ['RETRACED CRASH:'] + [l for l in r.stdout.splitlines() if l.strip()][:60]
          fails = [l for l in lines if l.startswith('FAIL')]
          summary = f"passed={sum(l.startswith('PASS') for l in lines)} failed={len(fails)}"
          print(f"::notice title=Smoke summary::{summary}")
          for i in range(0, min(len(lines), 200), 22):
              kind = 'error' if any(l.startswith(('FAIL', 'RETRACED')) for l in lines[i:i+22]) else 'notice'
              msg = '%0A'.join(l.replace('%', '%25').replace('\r', '') for l in lines[i:i+22])
              print(f"::{kind} title=Smoke {i // 22}::{msg}")
          PY

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubad-smoke-evidence
          path: smoke-out
          if-no-files-found: ignore
